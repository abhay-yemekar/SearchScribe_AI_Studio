name: Backup restore rehearsal

permissions:
  contents: read

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backup-restore.yml", "docs/deployment.md"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backup-restore.yml", "docs/deployment.md"]
  workflow_dispatch:

jobs:
  backup-restore:
    name: PostgreSQL backup, restore and previous-code acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: searchscribe
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: searchscribe_backup_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U searchscribe -d searchscribe_backup_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BACKUP_REHEARSAL: "1"
      APP_ENV: test
      AI_PROVIDER: mock
      BACKUP_REHEARSAL_DATABASE_URL: postgresql+psycopg://searchscribe:test-only-password@localhost:5432/searchscribe_restore_test
      REHEARSAL_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install project dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Seed fictional accounts and versioned articles
        run: python backend/scripts/backup_rehearsal.py seed --evidence "$RUNNER_TEMP/rehearsal.json"
        env:
          BACKUP_REHEARSAL_DATABASE_URL: postgresql+psycopg://searchscribe:test-only-password@localhost:5432/searchscribe_backup_test
      - name: Dump and restore into a new empty database
        env:
          REHEARSAL_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$REHEARSAL_POSTGRES_CONTAINER" pg_dump -U searchscribe --format=custom --file=/tmp/searchscribe-rehearsal.dump --dbname=searchscribe_backup_test
          docker exec "$REHEARSAL_POSTGRES_CONTAINER" pg_restore --list /tmp/searchscribe-rehearsal.dump > "$RUNNER_TEMP/rehearsal-archive-list.txt"
          test -s "$RUNNER_TEMP/rehearsal-archive-list.txt"
          docker exec "$REHEARSAL_POSTGRES_CONTAINER" createdb -U searchscribe --owner=searchscribe searchscribe_restore_test
          docker exec "$REHEARSAL_POSTGRES_CONTAINER" pg_restore -U searchscribe --exit-on-error --single-transaction --no-owner --no-acl --dbname=searchscribe_restore_test /tmp/searchscribe-rehearsal.dump
      - name: Compare all restored rows and exercise API integrity
        run: python backend/scripts/backup_rehearsal.py verify --evidence "$RUNNER_TEMP/rehearsal.json"
      - name: Check previous application against the restored schema
        run: |
          set -euo pipefail
          if [ -z "$REHEARSAL_BASE_REF" ]; then REHEARSAL_BASE_REF=$(git rev-parse HEAD^); fi
          git worktree add --detach "$RUNNER_TEMP/searchscribe-rollback" "$REHEARSAL_BASE_REF"
          REHEARSAL_ROLLBACK_SHA="$REHEARSAL_BASE_REF" python backend/scripts/backup_rehearsal.py rollback --app-root "$RUNNER_TEMP/searchscribe-rollback/backend" --evidence "$RUNNER_TEMP/rehearsal.json"
      - name: Publish synthetic acceptance evidence only
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-backup-restore-acceptance
          path: ${{ runner.temp }}/rehearsal.json
          retention-days: 7
          if-no-files-found: error
