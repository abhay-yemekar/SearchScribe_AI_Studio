name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        # Same major version as production (Neon) and the backup rehearsal.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: searchscribe
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: searchscribe_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U searchscribe -d searchscribe_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Test (pytest)
        run: python -m pytest
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://searchscribe:test-only-password@localhost:5432/searchscribe_test' || '' }}

  migrations:
    name: Migrations (Postgres 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: searchscribe
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: searchscribe_migrations
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U searchscribe -d searchscribe_migrations"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://searchscribe:test-only-password@localhost:5432/searchscribe_migrations
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply every migration to an empty database
        run: alembic upgrade head

      # Fails when a model changed without a matching migration.
      - name: Models match the migrations (alembic check)
        run: alembic check

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # PYSEC-2026-4146 (no fixed release): PyJWT decode() mutates a caller's
      # options dict. Every call here passes a fresh literal, so it can't apply.
      - name: Python runtime dependencies (pip-audit)
        working-directory: backend
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --progress-spinner off --ignore-vuln PYSEC-2026-4146

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Blocks on anything high or worse that ships to visitors.
      - name: Frontend runtime dependencies (npm audit, high+)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      # Dev tooling never ships; block only on critical, list the rest.
      - name: Frontend dev dependencies (npm audit, critical)
        working-directory: frontend
        run: npm audit --audit-level=critical

  frontend:
    name: Frontend (lint + types + unit tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright, mock AI provider)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../backend/requirements.txt -r ../backend/requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Against `next build` + `next start` (see playwright.config.ts), as deployed.
      - name: Run E2E tests
        run: npx playwright test
        env:
          E2E_PYTHON: python

      - name: Keep Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
